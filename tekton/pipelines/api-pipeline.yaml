apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: colorforge-backend-pipeline
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: colorforge
    app.kubernetes.io/component: backend
spec:
  description: |
    CI/CD Pipeline DevSecOps para ColorForge Go API.

    Stages:
    1. Clone
    2. Gitleaks (Secret Scan) - paralelo com Test
    3. Test + Grype (SCA) + Semgrep (SAST)
    4. SonarQube (Quality) - paralelo com Build Image
    5. Build Image
    6. Trivy Scan (Container)
    7. SBOM Generation (Syft) - paralelo com Cosign
    8. Cosign Sign (Image Signing)
    9. Update Manifests (GitOps)

    DevSecOps:
    - Gitleaks: Scan de secrets no codigo
    - Grype: Vulnerabilidades em dependencias (substitui OWASP)
    - Semgrep: SAST focado em seguranca (complementa SonarQube)
    - SonarQube: Qualidade de codigo e code smells
    - Trivy: Vulnerabilidades em containers
    - Syft: SBOM (Software Bill of Materials)
    - Cosign: Assinatura de imagens (Sigstore)
  params:
    # Git parameters
    - name: git-url
      type: string
      description: Git repository URL
      default: https://github.com/archub-io/mycolorforge-service.git
    - name: git-revision
      type: string
      description: Git revision to build
      default: main

    # Image parameters
    - name: image-registry
      type: string
      description: Container registry URL
      default: harbor.local
    - name: image-repository
      type: string
      description: Image repository path
      default: colorforge/backend
    - name: image-tag
      type: string
      description: Image tag
      default: latest

    # Build parameters
    - name: go-version
      type: string
      default: "1.24"
    - name: coverage-threshold
      type: string
      default: "0"

    # Registry options
    - name: skip-tls-verify
      type: string
      description: Skip TLS verification for self-signed certs
      default: "true"

    # Security parameters
    - name: security-scan-enabled
      type: string
      description: Enable security scans (Gitleaks, Grype, Semgrep)
      default: "true"
    - name: semgrep-enabled
      type: string
      description: Enable Semgrep SAST analysis
      default: "true"
    - name: fail-on-security-issues
      type: string
      description: Fail pipeline on security issues
      default: "true"
    - name: trivy-exit-code
      type: string
      description: Trivy exit code (1 = fail on vulnerabilities)
      default: "1"

    # SonarQube parameters
    - name: sonar-enabled
      type: string
      description: Enable SonarQube analysis
      default: "true"
    - name: sonar-quality-gate
      type: string
      description: Wait for Quality Gate result
      default: "true"

    # Supply Chain Security parameters
    - name: cosign-enabled
      type: string
      description: Enable Cosign image signing
      default: "true"
    - name: sbom-enabled
      type: string
      description: Enable SBOM generation with Syft
      default: "true"
    - name: cosign-signature-type
      type: string
      description: Cosign signature type (keyless or key)
      default: "keyless"

    # GitOps parameters
    - name: manifest-repo
      type: string
      description: Repository containing Kubernetes manifests
      default: https://github.com/archub-io/mycolorforge-infra.git
    - name: overlay-path
      type: string
      description: Path to Kustomize overlay
      default: k8s/overlays/staging

  workspaces:
    - name: shared-workspace
      description: Shared workspace for pipeline tasks
    - name: go-cache
      description: Go module and build cache (persistente)
    - name: trivy-cache
      description: Trivy vulnerability database cache
    - name: docker-credentials
      description: Docker config.json for registry authentication
    - name: git-credentials
      description: Git credentials for cloning and pushing
      optional: true
    - name: sonar-credentials
      description: SonarQube credentials (token and host URL)
      optional: true
    - name: cosign-key
      description: Cosign private key (if using key-based signing)
      optional: true

  tasks:
    # Stage 1: Clone repository
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"

    # Stage 2a: Gitleaks - Secret Scanning (paralelo com test)
    - name: gitleaks
      taskRef:
        name: gitleaks-scan
      runAfter:
        - clone
      when:
        - input: "$(params.security-scan-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: .
        - name: fail-on-leak
          value: $(params.fail-on-security-issues)

    # Stage 2b: Run tests (paralelo com gitleaks)
    - name: test
      taskRef:
        name: golang-test
      runAfter:
        - clone
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: cache
          workspace: go-cache
      params:
        - name: context
          value: .
        - name: packages
          value: "./..."
        - name: go-version
          value: $(params.go-version)
        - name: coverage-threshold
          value: $(params.coverage-threshold)
        - name: timeout
          value: "10m"

    # Stage 2c: Grype - Dependency Vulnerability Scan (substitui OWASP)
    - name: grype
      taskRef:
        name: grype-scan
      runAfter:
        - clone
      when:
        - input: "$(params.security-scan-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: .
        - name: fail-on-severity
          value: "critical"
        - name: output-format
          value: "table"

    # Stage 2d: Semgrep - Security-focused SAST (paralelo)
    - name: semgrep
      taskRef:
        name: semgrep-scan
      runAfter:
        - clone
      when:
        - input: "$(params.semgrep-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: .
        - name: config
          value: "auto"
        - name: severity
          value: "WARNING"
        - name: fail-on-findings
          value: $(params.fail-on-security-issues)
        - name: exclude-patterns
          value: "vendor,mocks,*_test.go"

    # Stage 3a: SonarQube Analysis (paralelo com build-image, após test)
    - name: sonarqube
      taskRef:
        name: sonarqube-scan
      runAfter:
        - test
      when:
        - input: "$(params.sonar-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: sonar-credentials
          workspace: sonar-credentials
      params:
        - name: project-key
          value: colorforge-backend
        - name: project-name
          value: "ColorForge Backend API"
        - name: project-version
          value: $(params.image-tag)
        - name: source-path
          value: .
        - name: language
          value: go
        - name: coverage-report
          value: coverage.out
        - name: quality-gate-wait
          value: $(params.sonar-quality-gate)
        - name: exclusions
          value: "**/vendor/**,**/*_test.go,**/mocks/**"

    # Stage 3b: Build container image (paralelo com sonarqube, após test)
    - name: build-image
      taskRef:
        name: kaniko-build
      runAfter:
        - test
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository)
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: Dockerfile
        - name: context
          value: .
        - name: cache
          value: "true"
        - name: cache-repo
          value: $(params.image-registry)/$(params.image-repository)-cache
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)

    # Stage 4: Trivy - Container Vulnerability Scan
    - name: trivy-scan
      taskRef:
        name: trivy-scan
      runAfter:
        - build-image
      workspaces:
        - name: cache
          workspace: trivy-cache
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: severity
          value: "HIGH,CRITICAL"
        - name: exit-code
          value: $(params.trivy-exit-code)
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)

    # Stage 5a: SBOM Generation with Syft (paralelo com cosign-sign)
    - name: sbom
      taskRef:
        name: syft-sbom
      runAfter:
        - trivy-scan
      when:
        - input: "$(params.sbom-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: output-format
          value: "cyclonedx-json"
        - name: output-file
          value: "sbom.json"
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)

    # Stage 5b: Cosign - Image Signing (paralelo com sbom)
    - name: cosign-sign
      taskRef:
        name: cosign-sign
      runAfter:
        - trivy-scan
      when:
        - input: "$(params.cosign-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: dockerconfig
          workspace: docker-credentials
        - name: cosign-key
          workspace: cosign-key
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: signature-type
          value: $(params.cosign-signature-type)
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)

    # Stage 6: Update Kubernetes manifests (GitOps)
    - name: update-manifests
      taskRef:
        name: kustomize-update
      runAfter:
        - sbom
        - cosign-sign
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: git-url
          value: $(params.manifest-repo)
        - name: git-branch
          value: master
        - name: overlay-path
          value: $(params.overlay-path)
        - name: image-name
          value: $(params.image-registry)/$(params.image-repository)
        - name: new-tag
          value: $(params.image-tag)
        - name: new-digest
          value: $(tasks.build-image.results.image-digest)

  results:
    - name: image-url
      description: Full image URL with digest
      value: $(tasks.build-image.results.image-url)
    - name: commit-sha
      description: Git commit that was built
      value: $(tasks.clone.results.commit)
    - name: test-coverage
      description: Test coverage percentage
      value: $(tasks.test.results.coverage)
