apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: colorforge-frontend-pipeline
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: colorforge
    app.kubernetes.io/component: frontend
spec:
  description: |
    CI/CD Pipeline DevSecOps para ColorForge Next.js Frontend.

    Stages:
    1. Clone
    2. Gitleaks (Secret Scan) - paralelo com Build
    3. Build + Grype (SCA) + Semgrep (SAST)
    4. SonarQube (Quality) - paralelo com Build Image
    5. Build Image
    6. Trivy Scan (Container)
    7. SBOM Generation (Syft) - paralelo com Cosign
    8. Cosign Sign (Image Signing)
    9. Update Manifests (GitOps)

    DevSecOps:
    - Gitleaks: Scan de secrets no codigo
    - Grype: Vulnerabilidades em dependencias (substitui OWASP)
    - Semgrep: SAST focado em seguranca (complementa SonarQube)
    - SonarQube: Qualidade de codigo e code smells
    - Trivy: Vulnerabilidades em containers
    - Syft: SBOM (Software Bill of Materials)
    - Cosign: Assinatura de imagens (Sigstore)
  params:
    # Git parameters
    - name: git-url
      type: string
      description: Git repository URL
      default: https://github.com/archub-io/mycolorforge-front.git
    - name: git-revision
      type: string
      description: Git revision to build
      default: master

    # Image parameters
    - name: image-registry
      type: string
      description: Container registry URL
      default: harbor.local
    - name: image-repository
      type: string
      description: Image repository path
      default: colorforge/frontend
    - name: image-tag
      type: string
      description: Image tag
      default: latest

    # Build parameters
    - name: node-version
      type: string
      default: "20"
    - name: package-manager
      type: string
      default: "npm"

    # Registry options
    - name: skip-tls-verify
      type: string
      description: Skip TLS verification for self-signed certs
      default: "true"

    # Security parameters
    - name: security-scan-enabled
      type: string
      description: Enable security scans (Gitleaks, Grype, Semgrep)
      default: "true"
    - name: semgrep-enabled
      type: string
      description: Enable Semgrep SAST analysis
      default: "true"
    - name: fail-on-security-issues
      type: string
      description: Fail pipeline on security issues
      default: "true"
    - name: trivy-exit-code
      type: string
      description: Trivy exit code (1 = fail on vulnerabilities)
      default: "1"

    # SonarQube parameters
    - name: sonar-enabled
      type: string
      description: Enable SonarQube analysis
      default: "true"
    - name: sonar-quality-gate
      type: string
      description: Wait for Quality Gate result
      default: "true"

    # Supply Chain Security parameters
    - name: cosign-enabled
      type: string
      description: Enable Cosign image signing
      default: "true"
    - name: sbom-enabled
      type: string
      description: Enable SBOM generation with Syft
      default: "true"
    - name: cosign-signature-type
      type: string
      description: Cosign signature type (keyless or key)
      default: "keyless"

    # Environment URLs (embedded at build time)
    - name: api-url
      type: string
      description: API URL for the frontend to connect to (include /api/v1)
      default: "https://api.colorforge.local/api/v1"
    - name: app-url
      type: string
      description: Frontend app URL
      default: "https://colorforge.local"
    - name: storage-url
      type: string
      description: Storage URL for images (MinIO)
      default: "https://minio.colorforge.local/mycolorforge"

    # Observability parameters (embedded at build time)
    - name: faro-enabled
      type: string
      description: Enable Faro observability
      default: "true"
    - name: faro-url
      type: string
      description: Faro/OTEL collector URL
      default: "https://otel.mycolorforge.com"
    - name: app-name
      type: string
      description: Application name for telemetry
      default: "colorforge-frontend"
    - name: app-version
      type: string
      description: Application version
      default: "1.0.0"

    # Keycloak authentication parameters (embedded at build time)
    - name: keycloak-url
      type: string
      description: Keycloak server URL
      default: "https://auth.archublab.com"
    - name: keycloak-realm
      type: string
      description: Keycloak realm name
      default: "colorforge"
    - name: keycloak-client-id
      type: string
      description: Keycloak client ID for frontend
      default: "colorforge-frontend"

    # GitOps parameters
    - name: manifest-repo
      type: string
      description: Repository containing Kubernetes manifests
      default: https://github.com/archub-io/mycolorforge-infra.git
    - name: overlay-path
      type: string
      description: Path to Kustomize overlay
      default: k8s/overlays/staging

  workspaces:
    - name: shared-workspace
      description: Shared workspace for pipeline tasks
    - name: node-cache
      description: Node modules cache (persistente)
    - name: trivy-cache
      description: Trivy vulnerability database cache
    - name: docker-credentials
      description: Docker config.json for registry authentication
    - name: git-credentials
      description: Git credentials for cloning and pushing
      optional: true
    - name: sonar-credentials
      description: SonarQube credentials (token and host URL)
      optional: true
    - name: cosign-key
      description: Cosign private key (if using key-based signing)
      optional: true

  tasks:
    # Stage 1: Clone repository
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"

    # Stage 2a: Gitleaks - Secret Scanning (paralelo com build)
    - name: gitleaks
      taskRef:
        name: gitleaks-scan
      runAfter:
        - clone
      when:
        - input: "$(params.security-scan-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: "."
        - name: fail-on-leak
          value: $(params.fail-on-security-issues)

    # Stage 2b: Build Next.js application (paralelo com gitleaks)
    - name: build
      taskRef:
        name: nodejs-build
      runAfter:
        - clone
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: cache
          workspace: node-cache
      params:
        - name: context
          value: "."
        - name: node-version
          value: $(params.node-version)
        - name: package-manager
          value: $(params.package-manager)
        - name: build-command
          value: build

    # Stage 2c: Grype - Dependency Vulnerability Scan (substitui OWASP)
    - name: grype
      taskRef:
        name: grype-scan
      runAfter:
        - clone
      when:
        - input: "$(params.security-scan-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: "."
        - name: fail-on-severity
          value: "high"
        - name: output-format
          value: "table"

    # Stage 2d: Semgrep - Security-focused SAST (paralelo)
    - name: semgrep
      taskRef:
        name: semgrep-scan
      runAfter:
        - clone
      when:
        - input: "$(params.semgrep-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: source-path
          value: "."
        - name: config
          value: "auto"
        - name: severity
          value: "WARNING"
        - name: fail-on-findings
          value: $(params.fail-on-security-issues)
        - name: exclude-patterns
          value: "node_modules,.next,dist,build,coverage"

    # Stage 3a: SonarQube Analysis (paralelo com build-image, após build)
    - name: sonarqube
      taskRef:
        name: sonarqube-scan
      runAfter:
        - build
      when:
        - input: "$(params.sonar-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: sonar-credentials
          workspace: sonar-credentials
      params:
        - name: project-key
          value: colorforge-frontend
        - name: project-name
          value: "ColorForge Frontend"
        - name: project-version
          value: $(params.image-tag)
        - name: source-path
          value: "."
        - name: language
          value: typescript
        - name: coverage-report
          value: coverage/lcov.info
        - name: quality-gate-wait
          value: $(params.sonar-quality-gate)
        - name: exclusions
          value: "**/node_modules/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx"

    # Stage 3b: Build container image (paralelo com sonarqube, após build)
    - name: build-image
      taskRef:
        name: kaniko-build
      runAfter:
        - build
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository)
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: Dockerfile
        - name: context
          value: "."
        - name: cache
          value: "true"
        - name: cache-repo
          value: $(params.image-registry)/$(params.image-repository)-cache
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)
        - name: build-args
          value:
            - --build-arg=NEXT_PUBLIC_API_URL=$(params.api-url)
            - --build-arg=NEXT_PUBLIC_APP_URL=$(params.app-url)
            - --build-arg=NEXT_PUBLIC_STORAGE_URL=$(params.storage-url)
            - --build-arg=NEXT_PUBLIC_FARO_ENABLED=$(params.faro-enabled)
            - --build-arg=NEXT_PUBLIC_FARO_URL=$(params.faro-url)
            - --build-arg=NEXT_PUBLIC_APP_NAME=$(params.app-name)
            - --build-arg=NEXT_PUBLIC_APP_VERSION=$(params.app-version)
            - --build-arg=NEXT_PUBLIC_KEYCLOAK_URL=$(params.keycloak-url)
            - --build-arg=NEXT_PUBLIC_KEYCLOAK_REALM=$(params.keycloak-realm)
            - --build-arg=NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=$(params.keycloak-client-id)

    # Stage 4: Trivy - Container Vulnerability Scan
    - name: trivy-scan
      taskRef:
        name: trivy-scan
      runAfter:
        - build-image
      workspaces:
        - name: cache
          workspace: trivy-cache
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: severity
          value: "HIGH,CRITICAL"
        - name: exit-code
          value: $(params.trivy-exit-code)
        - name: skip-tls-verify
          value: $(params.skip-tls-verify)

    # Stage 5a: SBOM Generation with Syft (paralelo com cosign-sign)
    - name: sbom
      taskRef:
        name: syft-sbom
      runAfter:
        - trivy-scan
      when:
        - input: "$(params.sbom-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: output-format
          value: "cyclonedx-json"
        - name: output-file
          value: "sbom.json"

    # Stage 5b: Cosign - Image Signing (paralelo com sbom)
    - name: cosign-sign
      taskRef:
        name: cosign-sign
      runAfter:
        - trivy-scan
      when:
        - input: "$(params.cosign-enabled)"
          operator: in
          values: ["true"]
      workspaces:
        - name: dockerconfig
          workspace: docker-credentials
        - name: cosign-key
          workspace: cosign-key
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-repository):$(params.image-tag)
        - name: signature-type
          value: $(params.cosign-signature-type)

    # Stage 6: Update Kubernetes manifests (GitOps)
    - name: update-manifests
      taskRef:
        name: kustomize-update
      runAfter:
        - sbom
        - cosign-sign
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: git-url
          value: $(params.manifest-repo)
        - name: git-branch
          value: master
        - name: overlay-path
          value: $(params.overlay-path)
        - name: image-name
          value: $(params.image-registry)/$(params.image-repository)
        - name: new-tag
          value: $(params.image-tag)
        - name: new-digest
          value: $(tasks.build-image.results.image-digest)

  results:
    - name: image-url
      description: Full image URL with digest
      value: $(tasks.build-image.results.image-url)
    - name: commit-sha
      description: Git commit that was built
      value: $(tasks.clone.results.commit)
