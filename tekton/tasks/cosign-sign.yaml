apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: colorforge
spec:
  description: |
    Assina imagens de container usando Cosign (Sigstore).
    Garante integridade e autenticidade das imagens.
  params:
    - name: image
      type: string
      description: Imagem completa com tag ou digest para assinar
    - name: signature-type
      type: string
      description: Tipo de assinatura (keyless ou key)
      default: "keyless"
    - name: skip-tls-verify
      type: string
      description: Skip TLS verification for self-signed certs
      default: "false"
  workspaces:
    - name: dockerconfig
      description: Docker config.json para autenticação no registry
    - name: cosign-key
      description: Chave privada do Cosign (se signature-type=key)
      optional: true
  results:
    - name: signature
      description: Assinatura da imagem
    - name: signed-image
      description: Imagem assinada
  steps:
    - name: sign-image
      image: harbor.archublab.com/mirror/library/alpine:3.19-6baf43584bcb@sha256:b58899f069c47216f6002a6850143dc6fae0d35eb8b0df9300bbe6327b9c2171
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
        - name: COSIGN_EXPERIMENTAL
          value: "1"
      script: |
        #!/bin/sh
        set -e

        echo "=== Installing Cosign ==="
        apk add --no-cache curl bash
        curl -sL https://github.com/sigstore/cosign/releases/download/v2.2.2/cosign-linux-amd64 -o /usr/local/bin/cosign
        chmod +x /usr/local/bin/cosign

        echo "=== Cosign Image Signing ==="
        echo "Image: $(params.image)"
        echo "Signature Type: $(params.signature-type)"
        echo "Skip TLS Verify: $(params.skip-tls-verify)"
        echo ""

        IMAGE="$(params.image)"

        # Set TLS skip if needed
        COSIGN_ARGS=""
        if [ "$(params.skip-tls-verify)" = "true" ]; then
          COSIGN_ARGS="--insecure-skip-verify"
          export COSIGN_INSECURE_SKIP_VERIFY=true
        fi

        case "$(params.signature-type)" in
          "keyless")
            echo "=== Using Keyless Signing (Sigstore/Fulcio) ==="
            # Keyless signing uses OIDC identity
            cosign sign --yes ${COSIGN_ARGS} "${IMAGE}" || {
              echo "WARNING: Keyless signing failed (requires OIDC setup)"
              echo "Skipping signing for now - image is not signed"
              printf "skipped" > "$(results.signature.path)"
              printf "%s" "${IMAGE}" > "$(results.signed-image.path)"
              exit 0
            }
            ;;
          "key")
            echo "=== Using Key-based Signing ==="
            if [ ! -f "$(workspaces.cosign-key.path)/cosign.key" ]; then
              echo "WARNING: cosign.key not found in workspace"
              echo "Skipping signing for now - image is not signed"
              printf "skipped" > "$(results.signature.path)"
              printf "%s" "${IMAGE}" > "$(results.signed-image.path)"
              exit 0
            fi
            cosign sign --key "$(workspaces.cosign-key.path)/cosign.key" --yes ${COSIGN_ARGS} "${IMAGE}"
            ;;
          *)
            echo "ERROR: Unknown signature type: $(params.signature-type)"
            exit 1
            ;;
        esac

        echo ""
        echo "=== Verifying Signature ==="
        cosign verify "${IMAGE}" --insecure-ignore-tlog=true 2>/dev/null || echo "Verification requires public key or keyless setup"

        # Write results
        printf "%s" "signed" > "$(results.signature.path)"
        printf "%s" "${IMAGE}" > "$(results.signed-image.path)"

        echo ""
        echo "=== Image Successfully Signed ==="
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
