apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: getwalletly
spec:
  description: |
    Assina imagens de container usando Cosign (Sigstore).
    Garante integridade e autenticidade das imagens.
  params:
  - description: Imagem completa com tag ou digest para assinar
    name: image
    type: string
  - default: key
    description: Only key-based signing is supported (no OIDC in the cluster)
    name: signature-type
    type: string
  - default: 'false'
    description: Skip TLS verification for self-signed certs
    name: skip-tls-verify
    type: string
  results:
  - description: Assinatura da imagem
    name: signature
    type: string
  - description: Imagem assinada
    name: signed-image
    type: string
  steps:
  - computeResources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
    - name: DOCKER_CONFIG
      value: $(workspaces.dockerconfig.path)
    - name: HOME
      value: /tekton/home
    image: harbor.archublab.com/mirror/sigstore/cosign:v3.1.3-dev@sha256:32b6d702a5c6663372a3242e7f9f66a9a3ad4bdb955eb4dfc5df0be8875b02d2
    name: sign-image
    script: |
      #!/busybox/sh
      # Key-based signing only. Any failure fails the task: an unsigned image must never look signed.
      set -eu
      IMAGE="$(params.image)"
      case "$IMAGE" in
        *@sha256:*) ;;
        *) echo "ERROR: sign by digest, got ${IMAGE}"; exit 1 ;;
      esac
      KEY="$(workspaces.cosign-key.path)/cosign.key"
      PUB="$(workspaces.cosign-key.path)/cosign.pub"
      if [ ! -s "$KEY" ] || [ ! -s "$PUB" ]; then
        echo "ERROR: cosign key pair missing in the cosign-key secret"
        exit 1
      fi
      COSIGN_PASSWORD="$(cat "$(workspaces.cosign-key.path)/cosign.password")"
      export COSIGN_PASSWORD
      # Private registry: do not publish image names to the public transparency log
      /ko-app/cosign sign --yes --key "$KEY" --use-signing-config=false --tlog-upload=false "$IMAGE"
      # Also in the classic .sig tag format: Kyverno 1.16 verifyImages does not read OCI referrer bundles
      /ko-app/cosign sign --yes --key "$KEY" --use-signing-config=false --tlog-upload=false --new-bundle-format=false "$IMAGE"
      /ko-app/cosign verify --key "$PUB" --insecure-ignore-tlog=true "$IMAGE" > /dev/null
      printf signed > "$(results.signature.path)"
      printf "%s" "$IMAGE" > "$(results.signed-image.path)"
      echo "=== ${IMAGE} signed and verified ==="
  workspaces:
  - description: Docker config.json para autenticacao no registry
    name: dockerconfig
  - description: Chave privada do Cosign (se signature-type=key)
    name: cosign-key
