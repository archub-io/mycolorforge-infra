apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: syft-sbom
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: getwalletly
spec:
  description: |
    Gera Software Bill of Materials (SBOM) usando Syft.
    Lista todas as dependencias e componentes da imagem.
  params:
  - description: Imagem para gerar SBOM
    name: image
    type: string
  - default: cyclonedx-json
    description: Formato do SBOM (spdx-json, cyclonedx-json, syft-json)
    name: output-format
    type: string
  - default: sbom.json
    description: Nome do arquivo SBOM
    name: output-file
    type: string
  - default: 'false'
    description: Skip TLS verification for self-signed certs
    name: skip-tls-verify
    type: string
  results:
  - description: Caminho do arquivo SBOM gerado
    name: sbom-path
    type: string
  - description: Numero de pacotes encontrados
    name: packages-count
    type: string
  steps:
  - computeResources:
      limits:
        cpu: '1'
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
    - name: DOCKER_CONFIG
      value: $(workspaces.dockerconfig.path)
    - name: HOME
      value: /tekton/home
    image: harbor.archublab.com/mirror/anchore/syft:v1.51.1-debug@sha256:15b4eab9f9ebfcbc687840b207ff948cd3fe3ffe2f633f74ab6bf8fd0dd33e80
    name: generate-sbom
    script: |
      #!/busybox/sh
      set -eu
      OUTPUT_PATH="$(workspaces.output.path)/$(params.output-file)"
      if [ "$(params.skip-tls-verify)" = "true" ]; then
        export SYFT_REGISTRY_INSECURE_SKIP_TLS_VERIFY=true
      fi
      /syft scan "$(params.image)" --output "$(params.output-format)=${OUTPUT_PATH}" --scope all-layers
      PACKAGES=$(grep -o '"bom-ref"' "${OUTPUT_PATH}" | wc -l | tr -d ' ')
      echo "SBOM ${OUTPUT_PATH}: ${PACKAGES} components"
      printf "%s" "${OUTPUT_PATH}" > "$(results.sbom-path.path)"
      printf "%s" "${PACKAGES}" > "$(results.packages-count.path)"
  workspaces:
  - description: Workspace para salvar o SBOM
    name: output
  - description: Docker config.json para autenticacao
    name: dockerconfig
