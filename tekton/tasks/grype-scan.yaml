apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: grype-scan
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: getwalletly
spec:
  description: |
    Scan de vulnerabilidades em dependencias usando Grype (Anchore).
    Suporta Go, Node.js, Python, Java, Ruby, Rust, etc.
  params:
  - default: .
    description: Caminho do codigo fonte no workspace
    name: source-path
    type: string
  - default: high
    description: Falhar se encontrar vulnerabilidades desta severidade ou maior (negligible, low, medium, high, critical)
    name: fail-on-severity
    type: string
  - default: table
    description: Formato do output (table, json, cyclonedx, sarif)
    name: output-format
    type: string
  - default: 'false'
    description: Mostrar apenas vulnerabilidades com fix disponivel
    name: only-fixed
    type: string
  - default: 'true'
    description: Ignorar vulnerabilidades da stdlib do Go
    name: ignore-stdlib
    type: string
  results:
  - description: Numero de vulnerabilidades encontradas
    name: vulnerabilities-count
    type: string
  - description: Numero de vulnerabilidades criticas
    name: critical-count
    type: string
  - description: Numero de vulnerabilidades altas
    name: high-count
    type: string
  - description: Status do scan (passed/failed)
    name: scan-status
    type: string
  steps:
  - computeResources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    env:
    - name: HOME
      value: /tekton/home
    - name: GRYPE_DB_CACHE_DIR
      value: /tekton/home/.cache/grype
    image: harbor.archublab.com/mirror/anchore/grype:v0.118.0-debug@sha256:96dc648def42b0eb75a04bc4911f463dd24c9e18851d543033f568d216902ce9
    name: grype-scan
    script: |
      #!/busybox/sh
      # grype's own exit code decides the result (no pipe: in sh a pipeline returns the last command's status)
      set -eu
      case "$(params.fail-on-severity)" in
        critical|high|medium|low) FAIL_ON="$(params.fail-on-severity)" ;;
        *) FAIL_ON=high ;;
      esac
      CONFIG=/tekton/home/grype.yaml
      : > "$CONFIG"
      if [ "$(params.ignore-stdlib)" = "true" ]; then
        printf 'ignore:\n  - package:\n      name: stdlib\n      type: go-module\n' > "$CONFIG"
      fi
      EXTRA=""
      if [ "$(params.only-fixed)" = "true" ]; then EXTRA="--only-fixed"; fi
      echo "=== Grype: fail on ${FAIL_ON} ==="
      set +e
      /grype dir:. --config "$CONFIG" --output table --output "json=/tekton/home/grype.json" ${EXTRA} --fail-on "${FAIL_ON}"
      SCAN_EXIT=$?
      set -e
      count() { grep -o "\"severity\":\"$1\"" /tekton/home/grype.json 2>/dev/null | wc -l | tr -d ' '; }
      CRITICAL=$(count Critical)
      HIGH=$(count High)
      TOTAL=$(grep -o '"vulnerability":{' /tekton/home/grype.json 2>/dev/null | wc -l | tr -d ' ')
      echo "Critical: ${CRITICAL} High: ${HIGH} Total: ${TOTAL}"
      printf "%s" "${TOTAL}" > "$(results.vulnerabilities-count.path)"
      printf "%s" "${CRITICAL}" > "$(results.critical-count.path)"
      printf "%s" "${HIGH}" > "$(results.high-count.path)"
      if [ "${SCAN_EXIT}" -ne 0 ]; then
        printf failed > "$(results.scan-status.path)"
        echo "=== Scan FAILED (grype exit ${SCAN_EXIT}) ==="
        exit 1
      fi
      printf passed > "$(results.scan-status.path)"
      echo "=== Scan PASSED ==="
    workingDir: $(workspaces.source.path)/$(params.source-path)
  workspaces:
  - description: Workspace com o codigo fonte
    name: source
