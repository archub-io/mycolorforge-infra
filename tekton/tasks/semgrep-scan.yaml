apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: semgrep-scan
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: getwalletly
spec:
  description: |
    Analise estatica de seguranca usando Semgrep.
    Leve, rapido e focado em vulnerabilidades de seguranca.
  params:
  - default: .
    description: Caminho do codigo fonte no workspace
    name: source-path
    type: string
  - default: p/default
    description: Configuracao do Semgrep (auto, p/security-audit, p/owasp-top-ten, etc)
    name: config
    type: string
  - default: ERROR
    description: Lowest severity that fails the task (ERROR, WARNING or INFO)
    name: severity
    type: string
  - default: 'true'
    description: Falhar se encontrar issues
    name: fail-on-findings
    type: string
  - default: node_modules,vendor,.next,dist,build,coverage
    description: Patterns para excluir (separados por virgula)
    name: exclude-patterns
    type: string
  results:
  - description: Numero de findings
    name: findings-count
    type: string
  - description: Numero de erros (severidade ERROR)
    name: errors-count
    type: string
  - description: Numero de warnings
    name: warnings-count
    type: string
  - description: Status do scan (passed/failed)
    name: scan-status
    type: string
  steps:
  - computeResources: {}
    env:
    - name: SEMGREP_SEND_METRICS
      value: 'off'
    - name: HOME
      value: /tekton/home
    image: harbor.archublab.com/mirror/semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    name: prepare
    script: |
      #!/bin/sh
      cat > /tekton/home/verdict.py <<'VERDICT'
      import json, sys
      out, threshold, f_total, f_err, f_warn = sys.argv[1:]
      order = {"INFO": 0, "WARNING": 1, "ERROR": 2}
      data = json.load(open(out))
      for e in data.get("errors", [])[:3]:
          print("scanner error:", str(e.get("message", ""))[:160], file=sys.stderr)
      results = data.get("results", [])
      sev = [r.get("extra", {}).get("severity", "INFO").upper() for r in results]
      for r in results[:40]:
          print(f"  {r['extra'].get('severity')} {r['check_id']} {r['path']}:{r['start']['line']}", file=sys.stderr)
      open(f_total, "w").write(str(len(results)))
      open(f_err, "w").write(str(sev.count("ERROR")))
      open(f_warn, "w").write(str(sev.count("WARNING")))
      limit = order.get(threshold.upper(), 2)
      print(sum(1 for s in sev if order.get(s, 0) >= limit))
      VERDICT
  - computeResources:
      limits:
        cpu: '1'
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
    - name: SEMGREP_SEND_METRICS
      value: 'off'
    - name: HOME
      value: /tekton/home
    image: harbor.archublab.com/mirror/semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    name: semgrep-scan
    script: |
      #!/bin/sh
      # Registry rulesets work with metrics off ("auto" does not). Results are counted from the JSON,
      # and the task fails when a finding at or above the chosen severity exists.
      set -eu
      EXCLUDES=""
      for pattern in $(echo "$(params.exclude-patterns)" | tr ',' ' '); do
        EXCLUDES="$EXCLUDES --exclude $pattern"
      done
      OUT=/tekton/home/semgrep.json
      set +e
      CONFIG="$(params.config)"
      # "auto" needs metrics; the registry default ruleset is the closest equivalent
      if [ "$CONFIG" = "auto" ]; then CONFIG="p/default"; fi
      semgrep scan --metrics off --config "$CONFIG" --json --output "$OUT" $EXCLUDES .
      RC=$?
      set -e
      if [ ! -s "$OUT" ]; then
        echo "semgrep produced no report (exit ${RC})"
        printf failed > "$(results.scan-status.path)"
        exit 1
      fi
      BLOCKING=$(python3 /tekton/home/verdict.py "$OUT" "$(params.severity)" "$(results.findings-count.path)" "$(results.errors-count.path)" "$(results.warnings-count.path)")
      echo "Findings at or above $(params.severity): ${BLOCKING}"
      if [ "$(params.fail-on-findings)" = "true" ] && [ "${BLOCKING}" -gt 0 ]; then
        printf failed > "$(results.scan-status.path)"
        echo "=== Scan FAILED ==="
        exit 1
      fi
      printf passed > "$(results.scan-status.path)"
      echo "=== Scan PASSED ==="
    workingDir: $(workspaces.source.path)/$(params.source-path)
  workspaces:
  - description: Workspace com o codigo fonte
    name: source
