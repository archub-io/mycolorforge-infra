apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: semgrep-scan
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: colorforge
spec:
  description: |
    Analise estatica de seguranca usando Semgrep.
    Leve, rapido e focado em vulnerabilidades de seguranca.
    Complementa o SonarQube com regras especificas de seguranca.
  params:
    - name: source-path
      type: string
      description: Caminho do codigo fonte no workspace
      default: "."
    - name: config
      type: string
      description: Configuracao do Semgrep (auto, p/security-audit, p/owasp-top-ten, etc)
      default: "auto"
    - name: severity
      type: string
      description: Severidade minima para reportar (INFO, WARNING, ERROR)
      default: "WARNING"
    - name: fail-on-findings
      type: string
      description: Falhar se encontrar issues
      default: "true"
    - name: exclude-patterns
      type: string
      description: Patterns para excluir (separados por virgula)
      default: "node_modules,vendor,.next,dist,build,coverage"
  workspaces:
    - name: source
      description: Workspace com o codigo fonte
  results:
    - name: findings-count
      description: Numero de findings
    - name: errors-count
      description: Numero de erros (severidade ERROR)
    - name: warnings-count
      description: Numero de warnings
    - name: scan-status
      description: Status do scan (passed/failed)
  steps:
    - name: semgrep-scan
      image: harbor.archublab.com/mirror/semgrep/semgrep:1.52.0-f33325700023@sha256:2151a972c372ab184f2dcd3dd1bc5f6775291d85aa8ff5d7fcc8dbc0adf9596a
      workingDir: $(workspaces.source.path)/$(params.source-path)
      env:
        - name: SEMGREP_SEND_METRICS
          value: "off"
      script: |
        #!/bin/sh
        set -e

        echo "=== Semgrep Security Scanner ==="
        echo "Source Path: $(params.source-path)"
        echo "Config: $(params.config)"
        echo "Severity: $(params.severity)"
        echo ""

        # Construir lista de exclusoes
        EXCLUDE_OPTS=""
        IFS=','
        for pattern in $(params.exclude-patterns); do
          EXCLUDE_OPTS="$EXCLUDE_OPTS --exclude $pattern"
        done
        unset IFS

        # Arquivo de output JSON para parsing
        OUTPUT_FILE="/tmp/semgrep-results.json"

        echo "=== Running Semgrep Analysis ==="

        # Executar semgrep
        SCAN_EXIT=0
        semgrep scan \
          --config $(params.config) \
          --severity $(params.severity) \
          --json \
          --output ${OUTPUT_FILE} \
          ${EXCLUDE_OPTS} \
          . 2>&1 || SCAN_EXIT=$?

        # Mostrar resultados em formato legivel
        echo ""
        echo "=== Findings Summary ==="

        if [ -f "${OUTPUT_FILE}" ]; then
          # Contar findings por severidade usando grep (sem jq)
          ERRORS=$(grep -o '"severity": "ERROR"' ${OUTPUT_FILE} 2>/dev/null | wc -l || echo "0")
          WARNINGS=$(grep -o '"severity": "WARNING"' ${OUTPUT_FILE} 2>/dev/null | wc -l || echo "0")
          INFO=$(grep -o '"severity": "INFO"' ${OUTPUT_FILE} 2>/dev/null | wc -l || echo "0")
          TOTAL=$((ERRORS + WARNINGS + INFO))

          echo "Errors: ${ERRORS}"
          echo "Warnings: ${WARNINGS}"
          echo "Info: ${INFO}"
          echo "Total: ${TOTAL}"

          # Mostrar detalhes dos findings
          if [ ${TOTAL} -gt 0 ]; then
            echo ""
            echo "=== Detailed Findings ==="
            # Extrair e mostrar findings principais
            grep -o '"check_id": "[^"]*"' ${OUTPUT_FILE} | head -20 | sort | uniq -c | sort -rn
          fi

          # Escrever resultados
          printf "%s" "${TOTAL}" > "$(results.findings-count.path)"
          printf "%s" "${ERRORS}" > "$(results.errors-count.path)"
          printf "%s" "${WARNINGS}" > "$(results.warnings-count.path)"
        else
          printf "0" > "$(results.findings-count.path)"
          printf "0" > "$(results.errors-count.path)"
          printf "0" > "$(results.warnings-count.path)"
          ERRORS=0
          TOTAL=0
        fi

        echo ""

        # Determinar status final
        if [ "$(params.fail-on-findings)" = "true" ] && [ ${ERRORS} -gt 0 ]; then
          printf "failed" > "$(results.scan-status.path)"
          echo "=== Scan FAILED - Security issues found ==="
          exit 1
        else
          printf "passed" > "$(results.scan-status.path)"
          echo "=== Scan PASSED ==="
        fi
      computeResources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "2Gi"
          cpu: "1000m"
