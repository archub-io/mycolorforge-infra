# ============================================
# External Services - Referências aos serviços transversais R7
# ============================================
# Estes ExternalName services permitem que a app use nomes locais
# que apontam para os namespaces corporativos (r7-data, r7-storage, etc.)
#
# Requer que r7/infra/k8s esteja deployado primeiro:
#   kubectl apply -k ../../../infra/k8s/base/
# ============================================

---
# PostgreSQL - aponta para r7-data namespace (nome antigo para compatibilidade)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: colorforge
  labels:
    app: postgres
    app.kubernetes.io/part-of: r7-infrastructure
spec:
  type: ExternalName
  externalName: postgresql.r7-data.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# PostgreSQL - alias alternativo
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: colorforge
  labels:
    app: postgres
    app.kubernetes.io/part-of: r7-infrastructure
spec:
  type: ExternalName
  externalName: postgresql.r7-data.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# MinIO API - aponta para r7-storage namespace
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: colorforge
  labels:
    app: minio
    app.kubernetes.io/part-of: r7-infrastructure
spec:
  type: ExternalName
  externalName: minio.r7-storage.svc.cluster.local
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

