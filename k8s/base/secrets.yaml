apiVersion: v1
kind: Secret
metadata:
  name: mycolorforge-secrets
  namespace: colorforge
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  # PostgreSQL do namespace mycolorforge (compartilhado)
  database-url: "postgres://mycolorforge:CHANGE_ME_POSTGRES_PASSWORD@postgres-service.mycolorforge.svc.cluster.local:5432/mycolorforge?sslmode=disable"
  jwt-secret: "CHANGE_ME_TO_A_SECURE_SECRET"
  # Redis local (no namespace colorforge)
  redis-url: "redis://redis:6379"
  # Billing (Stripe) — preencher após criar produtos/preços no Stripe.
  # secret key (sk_live_...), webhook signing secret (whsec_...) e os 4 price IDs.
  # Pix é cross-border (EBANX) — a Lda PT cobra brasileiros sem CNPJ.
  stripe-secret-key: "REPLACE_ME"
  stripe-webhook-secret: "REPLACE_ME"
  stripe-price-monthly-eur: "REPLACE_ME"
  stripe-price-monthly-brl: "REPLACE_ME"
  stripe-price-annual-eur: "REPLACE_ME"
  stripe-price-annual-brl: "REPLACE_ME"
