apiVersion: v1
kind: Secret
metadata:
  name: mycolorforge-secrets
  namespace: colorforge
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  # PostgreSQL transversal (r7-data namespace)
  database-url: "postgres://mycolorforge:CHANGE_ME_POSTGRES_PASSWORD@postgresql.r7-data.svc.cluster.local:5432/mycolorforge?sslmode=disable"
  jwt-secret: "CHANGE_ME_TO_A_SECURE_SECRET"
  # Redis local (no namespace colorforge)
  redis-url: "redis://redis:6379"
