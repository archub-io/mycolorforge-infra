apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: colorforge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: colorforge
type: Opaque
stringData:
  POSTGRES_DB: colorforge
  POSTGRES_USER: colorforge
  # Provide via SealedSecret / External Secret — do NOT commit real values.
  POSTGRES_PASSWORD: REPLACE_ME
  # Connection string for applications
  DATABASE_URL: postgres://colorforge:REPLACE_ME@postgres:5432/colorforge?sslmode=require
