apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: colorforge
  labels:
    app: api
    app.kubernetes.io/name: mycolorforge
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: mycolorforge
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mycolorforge-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GO_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: jwt-secret
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: redis-url
            # Billing (Stripe) — Pix cross-border via EBANX (no CNPJ needed)
            - name: APP_URL
              value: "https://mycolorforge.com"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-webhook-secret
            - name: STRIPE_PRICE_MONTHLY_EUR
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-price-monthly-eur
            - name: STRIPE_PRICE_MONTHLY_BRL
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-price-monthly-brl
            - name: STRIPE_PRICE_ANNUAL_EUR
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-price-annual-eur
            - name: STRIPE_PRICE_ANNUAL_BRL
              valueFrom:
                secretKeyRef:
                  name: mycolorforge-secrets
                  key: stripe-price-annual-brl
            - name: CORS_ORIGINS
              value: "https://mycolorforge.com,https://www.mycolorforge.com"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "tempo.r7-observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "mycolorforge-api"
            - name: OTEL_INSECURE
              value: "true"
            # Email (AWS SES)
            - name: EMAIL_ENABLED
              value: "true"
            - name: EMAIL_PROVIDER
              value: "ses"
            - name: EMAIL_FROM
              value: "noreply@mycolorforge.com"
            - name: EMAIL_FROM_NAME
              value: "MyColorForge"
            - name: AWS_REGION
              value: "sa-east-1"
            # AWS credentials via IAM role (IRSA) - no keys needed
            # MinIO Storage
            - name: MINIO_ENDPOINT
              value: "minio-service:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: MINIO_BUCKET
              value: "mycolorforge"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_PUBLIC_URL
              value: "https://api.mycolorforge.com/storage"
          # A paint plan decodes several reference images and evaluates a mix
          # for every colour against every pair on the shelf. At 300m — under a
          # third of a core — that took twenty-six seconds, past the point where
          # a caller assumes the request has failed. The request is raised too:
          # at 50m the pod got a token share under contention, which is not what
          # a service doing this work should be scheduled as.
          resources:
            requests:
              memory: "64Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: colorforge
  labels:
    app: api
    app.kubernetes.io/name: mycolorforge
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
