apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://localhost:9093

    analytics:
      reporting_enabled: false

    # Fila de pedidos de consulta por inquilino. Com os 100 por omissao, abrir o dashboard do
    # Grafana (13 consultas em simultaneo, cada uma partida em fatias) enche a fila: o agendador
    # descarta pedidos e o Loki responde 429 a consulta (o push nunca recebeu 429).
    query_scheduler:
      max_outstanding_requests_per_tenant: 2048

    limits_config:
      retention_period: 336h  # 14 dias; o compactor apaga o que for mais velho
      # Ingestao: ~4 KB/s de media, pico de 16 KB/s num minuto. Os limites abaixo sao >600x o pico.
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_streams_per_user: 10000
      max_line_size: 256kb
      # Poucos dados (~360 MB por dia em bruto): fatias de 6h bastam e dao 4 sub-pedidos
      # por dia consultado em vez de 48 (30m por omissao).
      split_queries_by_interval: 6h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
