apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels:
    app: loki
spec:
  replicas: 1
  # O volume e ReadWriteOnce e o WAL e o indice tem um unico dono: nunca dois pods ao mesmo tempo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      # O local-path prende o volume ao no onde o pod arranca pela primeira vez. O worker02 e o
      # unico com disco estavel (71 GB livres, sem DiskPressure desde 16/09); o worker01 e o
      # master entram em DiskPressure. O taint do pool de IA obriga a toleration.
      nodeSelector:
        archub.io/workload: ai
      tolerations:
        - key: archub.io/workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: loki
          image: harbor.archublab.com/mirror/grafana/loki:2.9.3-eb92f1a43917@sha256:d8585a80d577a849ac56393e10ee9a4475a55aca527f50ce722efeb39d8f59c1
          args:
            - '-config.file=/etc/loki/loki.yaml'
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9096
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          persistentVolumeClaim:
            claimName: loki-data
