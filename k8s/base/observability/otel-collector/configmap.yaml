apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "https://mycolorforge.com"
                - "https://www.mycolorforge.com"
                - "http://localhost:3000"
              allowed_headers:
                - "*"

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # MyColorForge metrics keep the historical colorforge_ prefix and namespace (its dashboards depend on it)
      resource:
        attributes:
          - key: service.namespace
            value: colorforge
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert

      # Other products set their own service.namespace; colorforge is only a fallback
      resource/defaults:
        attributes:
          - key: service.namespace
            value: colorforge
            action: insert
          - key: deployment.environment
            value: production
            action: upsert

      resource/environment:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert

      # Split metrics by product: MyColorForge and the collector itself -> 8889 (prefixed),
      # every other service (GetWalletly, ai-platform clients) -> 8890 (no prefix, GenAI semconv names)
      filter/colorforge-metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'resource.attributes["service.name"] != nil and not IsMatch(resource.attributes["service.name"], "^(mycolorforge|otel-collector)")'

      filter/shared-metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'resource.attributes["service.name"] == nil'
            - 'IsMatch(resource.attributes["service.name"], "^(mycolorforge|otel-collector)")'

      # Filter out health checks only
      filter:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.target"] == "/health"'
            - 'attributes["http.target"] == "/ready"'
            - 'attributes["http.route"] == "/health"'
            - 'attributes["http.route"] == "/ready"'

      # Tail sampling - 100% para Service Graph funcionar
      tail_sampling:
        decision_wait: 10s
        num_traces: 500
        expected_new_traces_per_sec: 100
        policies:
          - name: always-sample
            type: always_sample

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: colorforge
        send_timestamps: true
        metric_expiration: 5m
        resource_to_telemetry_conversion:
          enabled: false
        add_metric_suffixes: false

      prometheus/shared:
        endpoint: 0.0.0.0:8890
        send_timestamps: true
        metric_expiration: 5m
        resource_to_telemetry_conversion:
          enabled: false
        add_metric_suffixes: false

      loki:
        endpoint: http://loki:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: true
          job: true

      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

      debug:
        verbosity: detailed
        sampling_initial: 10
        sampling_thereafter: 50

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      telemetry:
        logs:
          level: debug
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter, tail_sampling, batch, resource/defaults]
          exporters: [otlp/tempo, debug]

        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, filter/colorforge-metrics, batch, resource]
          exporters: [prometheus]

        metrics/shared:
          receivers: [otlp]
          processors: [memory_limiter, filter/shared-metrics, batch, resource/environment]
          exporters: [prometheus/shared]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource/defaults]
          exporters: [loki]
